name: Build & Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_IMAGE: swseniordev/repositories:whatsapp-cloud-inbox

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Served at /inbox on the admin hosts (whatidea-deployment:
      # nginx/location-directive.conf), so the basePath is baked in here.
      - name: Build Docker image
        run: docker build --build-arg NEXT_PUBLIC_BASE_PATH=/inbox -t $DOCKER_IMAGE .

      # Pull requests only check that the image builds.
      - name: Log in to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: docker push $DOCKER_IMAGE
